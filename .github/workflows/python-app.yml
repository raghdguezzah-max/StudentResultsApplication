name: Student Results Application CI

on:
  push:
  pull_request:

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest

      - name: Run SCA
        run: |
          pip install pip-audit
          python -m pip_audit

      - name: Run SAST
        run: |
          pip install bandit
          python -m bandit main.py data_loader.py data_cleaner.py result_analyzer.py visualizer.py predictor.py
